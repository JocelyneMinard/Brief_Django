{% extends "base.html" %}

{% load static %}
{% block extra_css %}
	<link rel="stylesheet" href="{% static 'Account/css/Account.css' %}">
{% endblock  %}


{% block content %}
    <h2 class="text-2xl font-bold mb-4">Connexion</h2>
    <form method="post" class=" max-w-[400px]  mx-auto">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="cursor-pointer mt-4 px-4 py-2 bg-blue-600 text-white rounded">
            Se connecter
        </button>
    </form>
{% endblock %}
