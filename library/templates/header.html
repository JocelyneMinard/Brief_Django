{% load static %}
<header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-md">
    <div class="max-w-site mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/readme/" class="text-xl font-bold text-blue-600">
             <img src="{% static 'img/RML_logo.jpeg' %}" class="max-w-[60px] w-full h-auto">
        </a>
        <nav class="hidden md:flex space-x-6">
            <a href="/readme/" class="text-gray-600 hover:text-blue-600 transition">Accueil</a>
            <a href="/readme/catalog" class="text-gray-600 hover:text-blue-600 transition">Catalogue</a>
            <a href="#" class="text-gray-600 hover:text-blue-600 transition">Inscription</a>
        </nav>
        {% if user.is_authenticated %}

            <div class="inline-flex">
                <a href="#" class="text-gray-600 hover:text-blue-600 transition inline-flex items-center mr-4">
                    <img src="{% static 'img/user.svg' %}" class="max-w-[16px] h-auto mr-1">
                    <span>Profil</span>
                </a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                        Se déconnecter
                    </button>
                </form>
            </div>
        {% else %}
            <a href="/account/login" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition">
                Me connecter
            </a>
        {% endif %}
    </div>
</header>
