{% load static %} 
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadMe Library</title>
    <!-- Chargement de Tailwind CSS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
            content: [
                './templates/**/*.html',
                './ReadMe/templates/**/*.html',
                './ReadMe/forms.py', // Important pour les classes ajoutées dans CustomLoginForm !
            ],
            theme: {
                extend: {
                    maxWidth: {
                        'site': '1200px', // Définition personnalisée pour 1200px
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    {% include "header.html" %}
    
    <!-- CONTENU PRINCIPAL -->
    <!-- Le 'pt-24' (padding-top) évite que le haut du contenu soit caché sous le header fixe de 'h-16' -->
    <main class="w-full max-w-[1200px] mx-auto px-4 mt-24">
        {% block content %}
        {% endblock %}
    </main>

    {% include "footer.html" %}
</body>
</html>
