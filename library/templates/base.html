{% load static %} 
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReadMe Library{% endblock %}</title>
    {% tailwind_css %}
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    {% include "header.html" %}
    
    <!-- CONTENU PRINCIPAL -->
    <!-- Le 'pt-24' (padding-top) évite que le haut du contenu soit caché sous le header fixe de 'h-16' -->
    <main class="w-full max-w-[1200px] mx-auto px-4 mt-24 mb-12">
        {% block content %}
        {% endblock %}
    </main>

    {% include "footer.html" %}
</body>
</html>
